<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini D&D</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/main.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="title">Mini D&D</div>

        <div class="top-actions">
            <button id="saveBtn" class="secondary btn">Save</button>
            <button id="loadBtn" class="secondary btn">Load</button>
            <button id="resetBtn" class="danger btn">Reset</button>
        </div>
    </header>
    <main class="layout">

        <section class="card">
            <div class="card-header">
                <h2>Adventure</h2>
                <div class="small" id="uiRunMeta">Run: -</div>
            </div>

            <div class="status-grid">
                <div class="status">
                    <div class="status-top">
                        <span class="label">Player</span>
                        <span class="value" id="uiPlayerName">-</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill" id="barPlayerHp"></div>
                    </div>
                    <div class="status-bottom">
                        <span id="uiPlayerHp">-</span>
                        <span class="pill" id="uiClass">-</span>
                    </div>
                </div>

                <div class="status">
                    <div class="status-top">>
                        <span class="label">Enemies</span>
                        <span class="value" id="uiEnemyCount">-</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill" id="barEnemiesHp"></div>
                    </div>
                    <div class="status-bottom">
                        <span id="uiEnemiesHp">-</span>
                        <span class="pill" id="uiRoomType">-</span>
                    </div>
                </div>
            </div>

            <div class="split">
                <div class="panel">
                    <h3>Room</h3>
                    <div class="room-box">
                        <div class="room-title" id="uiRoomTitle">-</div>
                        <div class="room-desc" id="uiRoomDesc">Start a run to begin.</div>
                    </div>

                    <div class="choice-row">
                        <button id="leftBtn" class="btn">Left</button>
                        <button id="forwardBtn" class="btn">Forward</button>
                        <button id="rightBtn" class="btn">Right</button>
                    </div>
                </div>

                <div class="panel">
                    <h3>Combat</h3>
                    <div class="btn-row">
                        <button id="attackBtn" class="primary btn">Attack</button>
                        <button id="specialBtn" class="primary btn">Special</button>
                        <button id="potionBtn" class="btn">Use Potion</button>
                        <button id="runBtn" class="secondary btn">Run</button>
                    </div>
                    <div class="btn-row">
                        <button id="nextRoomBtn" class="btn" disabed>Continue</button>
                    </div>
                
                    <div class="enemies" id="uiEnemiesList"></div>
                </div>
            </div>

            <div class="log-wrap">
                <div class="log-head">
                    <h3>Log</h3>
                    <button id="clearLogBtn" class="tiny secondary btn">Clear</button>
                </div>
                <div class="log" id="log" aria-live="polite"></div>
            </div>
        </section>

        <aside class="card">
            <div class="card-header">
                <h2>Character</h2>
                <div class="small">Create</div>
            </div>

            <label class="lbl">Name</label>
            <input id="name" class="inp"/>

            <label class="lbl">Class</label>
            <select id="klass" class="inp">
                <option value="Fighter">Fighter (+2 weapon damage)</option>
                <option value="Rogue">Rouge (+2 to Scout & dodging)</option>
                <option value="Wizard">Wizard (3 spells per encounter)</option>
                <option value="Cleric">Cleric (2 heals per game)</option>
            </select>

            <label class="lbl">+2 Stat Boost</label>
            <select id="boost" class="inp">
                <option value="STR">Strength</option>
                <option value="DEX">Dexterity</option>
                <option value="INT">Intelligence</option>
                <option value="CHA">Charisma</option>
            </select>

            <div class="btn-row">
                <button id="startBtn" class="primary btn">Start Run</button>
            </div>

            <div class="divider"></div>

            <div class="inv">
                <div class="inv-head">
                    <h3>Inventory</h3>
                    <div class="small">Auto-loot from rooms</div>
                </div>

                <div class="inv-grid">
                    <div class="inv-item">
                        <div class="label">Gold</div>
                        <div class="value" id="uiGold">-</div>
                    </div>
                    <div class="inv-item">
                        <div class="label">Potions</div>
                        <div class="value" id="uiPotions">-</div>
                    </div>
                    <div class="inv-item">
                        <div class="label">Weapon</div>
                        <div class="value" id="uiWeapon">-</div>
                    </div>
                    <div class="inv-item">
                        <div class="label">Stats</div>
                        <div class="value small" id="uiStats">-</div>
                    </div>
                </div>

                <div class="shop">
                    <div class="shop-title">Shop</div>
                    <div class="btn-row">
                        <button id="buyPotionBtn" class="btn" disabled>Buy Potion (10g)</button>
                        <button id="buyUpgradeBtn" class="btn" disabled>Upgrade Weapon (25g)</button>
                    </div>
                </div>
            </div>
        </aside>
    </main>          
</body>
</html>
