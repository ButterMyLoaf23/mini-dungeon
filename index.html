<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini D&D</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="wrap">
            <header class="topbar">
                <h1>Mini D&D</h1>
                <div class="meta" id="uiRunMeta">Run: -</div>
            </header>

        <main class="grid">

            <section class="card">
                <div class="cardHeader">
                    <h2>Adventure</h2>
                    <div class="roomMeta">
                        <div class="badge" id="uiRoomType">-</div>
                        <div class="muted" id="uiRoomProgress">Room - / -</div>
                    </div>
                </div>

                <div class="roomBox">
                    <div class="roomTitle" id="uiRoomTitle">Start a run</div>
                    <div class="roomDesc" id="uiRoomDesc">Create your character and click start</div>
                </div>

                <div class="bars">
                    <div class="barRow">
                        <div class="label">
                            <span class="name" id="uiPlayerName">-</span>
                            <span class="value" id="uiPlayerHpText">-</span>
                        </div>

                        <div class="bar">
                            <div class="fill" id="barPlayerHp"></div>
                        </div>
                    </div>

                    <div class="barRow">
                        <div class="label">
                            <span class="name">Enemies</span>
                            <span class="value" id="uiEnemiesHpText">-</span>
                        </div>

                        <div class="bar">
                            <div class="fill" id="barEnemiesHp"></div>
                        </div>
                    </div>
                </div>

                <div class="log" id="log" aria-live="polite"></div>

                <div class="split">
                    <div class="panel">
                        <h3>Enemies</h3>
                        <div class="enemyControls">
                            <label for="selTarget" class="muted">Target</label>
                            <select id="selTarget"></select>
                        </div>
                        <div class="enemyList" id="uiEnemyList"></div>
                    </div>

                    <div class="panel">
                        <h3>Inventory</h3>
                        <div class="invGrid">
                            <div class="invItem"><span class="muted">Class</span><b id="uiClass">-</b></div>
                            <div class="invItem"><span class="muted">Gold</span><b id="uiGold">-</b></div>
                            <div class="invItem"><span class="muted">Potions</span><b id="uiPotions">-</b></div>
                            <div class="invItem"><span class="muted">Weapon</span><b id="uiWeapon">-</b></div>
                            <div class="invItem"><span class="muted">Level</span><b id="uiLevel">-</b></div>
                            <div class="invItem"><span class="muted">XP</span><b id="uiXp">-</b></div>
                        </div>
                        <div class="muted statsLine" id="uiStats">-</div>
                    </div>
                </div>

                <div class="actions">
                    <button id="btnAttack" disabled>Attack</button>
                    <button id="btnSpecial" disabled>Special</button>
                    <button id="btnPotion" disabled>Use Potion</button>
                    <button id="btnFlee" disabled>Flee</button>
                </div>

                <div class="nav">
                    <button id="btnLeft" disabled>Left</button>
                    <button id="btnForward" disabled>Forward</button>
                    <button id="btnRight" disabled>Right</button>
                    <button id="btnNextRoom" disabled>Continue</button>
                </div>

                
            </section>

            <aside class="card">
                <h2>Character Setup</h2>

                <label>Name</label>
                <input id="name"/>

                <label>Class</label>
                <select id="klass">
                    <option value="Fighter">Fighter (+2 weapon damage)</option>
                    <option value="Rogue">Rogue (Better dodging and scouting abilities)</option>
                    <option value="Wizard">Wizard (3 spells)</option>
                    <option value="Cleric">Cleric (2 heals)</option>
                </select>

                <label>Choose your stat boost</label>
                <select id="boost">
                    <option value="STR">Strength</option>
                    <option value="DEX">Dexterity</option>
                    <option value="INT">Intelligence</option>
                    <option value="CHA">Charisma</option>
                </select>

                <div class="actions">
                    <button id="btnStart">Start</button>
                    <button id="btnSave">Save</button>
                    <button id="btnLoad">Load</button>
                    <button id="btnReset">Reset</button>
                </div>
            </aside>
        </main>
    </div>

    <div id="lvlOverlay" class="overlay hidden" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="lvlTitle">
            <h2 id="lvlTitle">Level Up!</h2>
            <p class="muted" id="lvlDesc">Choose one stat to increase by +1</p>

            <div class="lvlGrid">
                <button id="btnLvlStr">+1 STR</button>
                <button id="btnLvlDex">+1 DEX</button>
                <button id="btnLvlInt">+1 INT</button>
                <button id="btnLvlCha">+1 CHA</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    </body>
    </html>
